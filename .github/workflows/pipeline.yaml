name: CI Pipeline

on: 
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest


    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '>=22.12.0'

      - name: Install dependensices
        run: npm install

      - name: Run Typecheck
        run: npm run typecheck
      
      - name: Run Checs
        run: npm run check

      - name: Build project
        run: npm run build