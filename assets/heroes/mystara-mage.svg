  <!-- Magical Aura Circle -->
  <circle cx="64" cy="90" r="32" fill="none" stroke="#4ecdc4" stroke-width="2" opacity="0.5"/>

  <!-- Staff -->
  <rect x="92" y="52" width="6" height="60" fill="#8b4513" stroke="#000" stroke-width="1"/>
  <circle cx="95" cy="48" r="8" fill="#764ba2" stroke="#000" stroke-width="1"/>
  <rect x="88" y="42" width="14" height="10" fill="#ffd93d" stroke="#000" stroke-width="1"/>

  <!-- Legs -->
  <rect x="56" y="118" width="12" height="28" fill="#764ba2" stroke="#000" stroke-width="1"/>
  <rect x="60" y="118" width="8" height="28" fill="#8b6bb2" stroke="#000" stroke-width="1"/>

  <!-- Boots -->
  <rect x="54" y="146" width="14" height="10" fill="#8b6bb2" stroke="#000" stroke-width="1"/>
  <rect x="68" y="146" width="14" height="10" fill="#8b6bb2" stroke="#000" stroke-width="1"/>
</svg>