<svg viewBox="0 0 128 160" width="512" height="640" xmlns="http://www.w3.org/2000/svg">

  <!-- Pointy Hat -->
  <polygon points="64,12 44,32 84,32" fill="#764ba2" stroke="#000" stroke-width="1"/>
  <rect x="44" y="32" width="40" height="6" fill="#764ba2" stroke="#000" stroke-width="1"/>
  <rect x="60" y="20" width="8" height="14" fill="#ffd93d" stroke="#000" stroke-width="1"/>

  <!-- Head -->
  <rect x="44" y="38" width="40" height="28" fill="#667eea" stroke="#000" stroke-width="1"/>

  <!-- Glowing Eyes -->
  <rect x="48" y="44" width="6" height="6" fill="#4ecdc4" stroke="#000" stroke-width="1"/>
  <rect x="50" y="46" width="2" height="2" fill="#ffffff"/>
  <rect x="74" y="44" width="6" height="6" fill="#4ecdc4" stroke="#000" stroke-width="1"/>
  <rect x="76" y="46" width="2" height="2" fill="#ffffff"/>

  <!-- Mouth -->
