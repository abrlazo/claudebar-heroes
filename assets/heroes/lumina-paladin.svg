<svg viewBox="0 0 128 160" width="512" height="640" xmlns="http://www.w3.org/2000/svg">

  <!-- Holy Crown -->
  <rect x="40" y="24" width="48" height="8" fill="#ffd93d" stroke="#000" stroke-width="1"/>
  <rect x="48" y="16" width="8" height="10" fill="#ffd93d" stroke="#000" stroke-width="1"/>
  <rect x="56" y="12" width="8" height="14" fill="#ffd93d" stroke="#000" stroke-width="1"/>
  <rect x="64" y="16" width="8" height="10" fill="#ffd93d" stroke="#000" stroke-width="1"/>

  <!-- Head -->
  <rect x="44" y="32" width="40" height="28" fill="#667eea" stroke="#000" stroke-width="1"/>

  <!-- Eyes (noble) -->
  <rect x="48" y="40" width="6" height="6" fill="#ffffff" stroke="#000" stroke-width="1"/>
  <rect x="50" y="42" width="2" height="2" fill="#000"/>
  <rect x="74" y="40" width="6" height="6" fill="#ffffff" stroke="#000" stroke-width="1"/>
  <rect x="76" y="42" width="2" height="2" fill="#000"/>

  <!-- Mouth -->
  <rect x="56" y="52" width="16" height="3" fill="#000"/>

  <!-- Holy Body Armor -->
  <rect x="36" y="60" width="56" height="52" fill="#ffd93d" stroke="#000" stroke-width="1"/>
  <rect x="40" y="64" width="48" height="44" fill="#ffed4e" stroke="#000" stroke-width="1"/>

  <!-- Holy Cross -->
  <rect x="60" y="72" width="8" height="20" fill="#667eea" stroke="#000" stroke-width="1"/>
  <rect x="52" y="80" width="24" height="6" fill="#667eea" stroke="#000" stroke-width="1"/>

  <!-- Left Arm -->
  <rect x="28" y="68" width="10" height="40" fill="#ffd93d" stroke="#000" stroke-width="1"/>
  <rect x="24" y="104" width="6" height="16" fill="#ffd93d" stroke="#000" stroke-width="1"/>

  <!-- Holy Shield -->
  <rect x="14" y="72" width="16" height="36" fill="#ffed4e" stroke="#000" stroke-width="1"/>
  <circle cx="22" cy="90" r="6" fill="#667eea" stroke="#000" stroke-width="1"/>

  <!-- Right Arm -->
  <rect x="90" y="68" width="10" height="40" fill="#ffd93d" stroke="#000" stroke-width="1"/>
  <rect x="96" y="104" width="6" height="16" fill="#ffd93d" stroke="#000" stroke-width="1"/>

  <!-- Legs -->
  <rect x="56" y="112" width="10" height="32" fill="#ffd93d" stroke="#000" stroke-width="1"/>
  <rect x="62" y="112" width="10" height="32" fill="#ffd93d" stroke="#000" stroke-width="1"/>

  <!-- Holy Boots -->
  <rect x="54" y="144" width="12" height="10" fill="#ffed4e" stroke="#000" stroke-width="1"/>
  <rect x="66" y="144" width="12" height="10" fill="#ffed4e" stroke="#000" stroke-width="1"/>
</svg>